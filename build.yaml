targets:
  $default:
    builders:
      drift_dev:
        options:
          # Times as ISO-8601 text (UTC, readable in sqlite3) instead of Unix seconds.
          store_date_time_values_as_text: true
          # Schema dumps and generated migration tests (`dart run drift_dev make-migrations`).
          databases:
            gymlog: lib/data/db/database.dart
          schema_dir: drift_schemas/
          test_dir: test/data/db/migrations/
