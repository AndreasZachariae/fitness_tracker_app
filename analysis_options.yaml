# Static analysis for GymLog. `flutter analyze` must report zero issues.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    # Written by `drift_dev schema generate` / `make-migrations`, not by hand.
    - test/data/db/migrations/gymlog/generated/**
    - lib/data/db/database.steps.dart

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_slow_async_io
    - cancel_subscriptions
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - use_super_parameters
